[project]
name = "isola-python-runtime"
version = "0.5.1"
requires-python = ">=3.15"
dependencies = [
    "pydantic>=2.11.1",
    "pyyaml>=6.0.2",
    "cbor2>=5.6.0",
    "httpx2>=2.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["python/sandbox"]
sources = ["python"]

[tool.ruff]
target-version = "py315"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "missing-trailing-comma", "assert", "CPY",
    "D10", "incorrect-blank-line-before-class", "multi-line-summary-second-line",
    "PLR09", "magic-value-comparison", "import-private-name", "complex-structure",
    "too-many-statements-in-try-clause",
]
extend-safe-fixes = ["TC"]
preview = true
future-annotations = true

[tool.ruff.lint.per-file-ignores]
"python/tests/**/*.py" = ["blind-except", "import-outside-top-level", "DOC", "implicit-namespace-package", "missing-type-function-argument"]

[tool.ruff.format]
preview = true

[tool.mypy]
files = ["crates/python-runtime/python"]
strict = true
python_version = "3.15"
mypy_path = "crates/python-runtime/python/typings"
disable_error_code = [
    "decorated-any",
    "explicit-any",
    "any",
]

[tool.pyright]
venv = ".venv"
venvPath = "../.."
include = ["./python"]
stubPath = "./python/typings"
typeCheckingMode = "strict"
enableExperimentalFeatures = true
reportMissingModuleSource = false
