name: JS

on:
  push:
    branches:
      - main
      - develop
      - renovate/**
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: crates/js-sdk/npm/package.json
      - name: Install dependencies
        run: pnpm install
      - name: Type check
        run: pnpm --filter isola-core tsc --noEmit
      - name: Validate package entrypoint
        run: |
          pnpm --filter isola-core run build
          node --input-type=module -e "import('./crates/js-sdk/npm/dist/index.js')"
